name: Bug
description: Algo não funciona / Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Valeu por reportar! / Thanks for reporting!
        No app: **Preferências › Ajuda › Copiar diagnóstico** e cole abaixo.
        In the app: **Preferences › Help › Copy diagnostics** and paste it below.
  - type: dropdown
    id: platform
    attributes:
      label: Sistema / System
      options:
        - macOS
        - Windows 11
        - Windows 10
        - Docker / servidor de sync
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Fone / caixa / DAC (Headphones / speakers / DAC)
      placeholder: "ex: Sennheiser Momentum 4 (Bluetooth)"
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu? / What happened?
      description: O que você esperava e o que aconteceu. / What you expected vs. what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir / Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico / Diagnostics
      description: Preferências › Ajuda › Copiar diagnóstico. Confira antes de postar. / Check it before posting.
      render: markdown
    validations:
      required: true
