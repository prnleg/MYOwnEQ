name: release

# Push a tag like v0.2.0 to publish:
#   - MyOwnEQ-<v>.dmg + MyOwnEQ-mac.zip (universal, updater uses the zip)
#   - MyOwnEQ-Setup-<v>.exe (per-user installer, also used by the updater)
#   - latest.json (update manifest, every artifact ed25519-signed)
#   - ghcr.io/prnleg/myowneq-server:<v> and :latest
#
# Required secret: MYOWNEQ_SIGNING_KEY (see RELEASING.md).
# Optional secrets: MAC_CERT_P12 + MAC_CERT_PASSWORD (stable macOS signature,
# so the audio permission survives updates); SITE_DEPLOY_HOOK (Cloudflare Pages
# deploy hook: rebuilds myowneq.com so the new version shows up in its diário).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Import signing certificate (optional)
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          PASS: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "No MAC_CERT_P12: building ad-hoc signed"; exit 0; fi
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') / $(swift --version 2>&1 | head -1)"

      - name: Build universal app
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}" mac/scripts/build-app.sh 2>&1 | tee build.log || {
            echo "::error::$( (grep -E 'error:' build.log || true) | head -6 | tr '\n' '|')"
            echo "::error::TAIL $(tail -12 build.log | tr '\n' '|')"
            exit 1
          }

      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p dist dmg
          ditto -c -k --keepParent mac/build/MyOwnEQ.app dist/MyOwnEQ-mac.zip
          cp -R mac/build/MyOwnEQ.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "MyOwnEQ $V" -srcfolder dmg -ov -format UDZO "dist/MyOwnEQ-$V.dmg"

      - name: Command line extension (universal)
        run: |
          cargo build --release -p myowneq-cli --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p cli
          lipo -create -output cli/myowneq target/aarch64-apple-darwin/release/myowneq target/x86_64-apple-darwin/release/myowneq
          cp extensions/cli/README.md cli/
          (cd cli && zip -q ../dist/myowneq-cli-mac.zip myowneq README.md)

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          cargo build --release -p myowneq-ffi -p myowneq-engine -p myowneq-cli
          if (!(Test-Path target/release/myowneq_engine.dll)) { throw "myowneq_engine.dll missing" }
          dotnet publish windows/MyOwnEQ/MyOwnEQ.csproj -c Release -r win-x64 --self-contained true -p:Version=$v -o windows/publish
          if (!(Test-Path windows/publish/myowneq_ffi.dll)) { throw "myowneq_ffi.dll missing" }

      - name: Self-test (the real app starts, opens its windows, exits cleanly)
        shell: pwsh
        run: |
          $env:MYOWNEQ_DATA_DIR = Join-Path $env:RUNNER_TEMP "meq-selftest"
          $p = Start-Process -FilePath "windows/publish/MyOwnEQ.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "self-test hung" }
          $log = Join-Path $env:MYOWNEQ_DATA_DIR "logs/myowneq.log"
          if (Test-Path $log) { Get-Content $log | ForEach-Object { "::error::$_" } }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Installer
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$v" windows/installer/MyOwnEQ.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Command line extension
        shell: pwsh
        run: Compress-Archive -Path target/release/myowneq.exe, extensions/cli/README.md -DestinationPath dist/myowneq-cli-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/prnleg/myowneq-server:${{ github.ref_name }}
            ghcr.io/prnleg/myowneq-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist

      - name: Sign + manifest
        env:
          MYOWNEQ_SIGNING_KEY: ${{ secrets.MYOWNEQ_SIGNING_KEY }}
        run: |
          if [ -z "$MYOWNEQ_SIGNING_KEY" ]; then echo "::error::MYOWNEQ_SIGNING_KEY secret is missing (see RELEASING.md)"; exit 1; fi
          V="${GITHUB_REF_NAME#v}"
          cargo run -q --release -p myowneq-release -- manifest "$GITHUB_REF_NAME" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --mac dist/MyOwnEQ-mac.zip \
            --windows "dist/MyOwnEQ-Setup-$V.exe" > dist/latest.json
          cat dist/latest.json
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # After the release is public: the site reads it at build time. A failure here
      # never fails the release (the site's visitors check GitHub on their own too).
      - name: Rebuild the site (optional)
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$SITE_DEPLOY_HOOK" ]; then echo "SITE_DEPLOY_HOOK not set, skipping"; exit 0; fi
          curl -fsS -X POST --retry 3 --max-time 30 "$SITE_DEPLOY_HOOK" > /dev/null
          echo "site rebuild requested"
