name: core

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]

# A new push to a PR cancels the run still going for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    # Mac and Windows must stay feature-equal (parity/features.json, CONTRIBUTING.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Same features on both platforms
        run: python3 scripts/parity.py
      - name: Translations complete (both platforms)
        run: python3 scripts/lang-keys.py --check

  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Interop tests (C# × real core) run once, on Windows, in windows.yml.

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') / $(swift --version 2>&1 | head -1)"
      - name: Translations complete
        run: python3 scripts/lang-keys.py --check
      - name: Build app (native arch)
        run: |
          set -o pipefail
          mac/scripts/build-app.sh --native 2>&1 | tee build.log || {
            echo "::error::$( (grep -E 'error:' build.log || true) | head -6 | tr '\n' '|')"
            echo "::error::TAIL $(tail -12 build.log | tr '\n' '|')"
            exit 1
          }
      - name: App reads sparse library JSON (every optional field missing)
        run: mac/build/MyOwnEQ.app/Contents/MacOS/MyOwnEQ --check-library mac/Tests/fixtures/library-sparse.json
