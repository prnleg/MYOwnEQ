name: core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Interop tests (C# models vs real Rust core)
        run: |
          cargo build -p myowneq-ffi
          dotnet run --project windows/InteropTests

  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          echo "::notice::$(xcodebuild -version | tr '\n' ' ') / $(swift --version 2>&1 | head -1)"
      - name: Translations complete
        run: python3 scripts/lang-keys.py --check
      - name: Build app (native arch)
        run: |
          set -o pipefail
          mac/scripts/build-app.sh --native 2>&1 | tee build.log || {
            echo "::error::$( (grep -E 'error:' build.log || true) | head -6 | tr '\n' '|')"
            echo "::error::TAIL $(tail -12 build.log | tr '\n' '|')"
            exit 1
          }
      - name: App reads sparse library JSON (every optional field missing)
        run: mac/build/MyOwnEQ.app/Contents/MacOS/MyOwnEQ --check-library mac/Tests/fixtures/library-sparse.json
