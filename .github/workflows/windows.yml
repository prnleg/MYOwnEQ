name: windows

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Rust core (DLL)
        run: cargo build --release -p myowneq-ffi -p myowneq-engine

      - name: Interop tests (C# models vs real Rust core)
        run: dotnet run --project windows/InteropTests -c Release -p:RustDir=../../target/release

      - name: Publish app
        run: dotnet publish windows/MyOwnEQ/MyOwnEQ.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Check DLL is next to the exe
        shell: pwsh
        run: |
          if (!(Test-Path publish/myowneq_ffi.dll)) { throw "myowneq_ffi.dll missing from publish output" }
          if (!(Test-Path publish/myowneq_engine.dll)) { throw "myowneq_engine.dll missing from publish output" }

      - name: Self-test (the real app starts, opens its windows, exits cleanly)
        shell: pwsh
        run: |
          $env:MYOWNEQ_DATA_DIR = Join-Path $env:RUNNER_TEMP "meq-selftest"
          $p = Start-Process -FilePath "publish/MyOwnEQ.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "self-test hung" }
          $log = Join-Path $env:MYOWNEQ_DATA_DIR "logs/myowneq.log"
          if (Test-Path $log) { Get-Content $log | ForEach-Object { "::error::$_" } }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Installer compiles (not uploaded; releases build the real one)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows/publish | Out-Null
          Copy-Item publish/* windows/publish -Recurse -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=0.0.0" windows/installer/MyOwnEQ.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Self-test screenshots + log (only when it failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-screenshots
          path: ${{ runner.temp }}/meq-selftest/logs/
          if-no-files-found: ignore
          retention-days: 7

      # Test build of the app (main / manual runs only). Remove once releases are
      # the only way to get builds (see ROADMAP.md).
      - name: App build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MyOwnEQ-windows-x64
          path: publish/
          retention-days: 7
