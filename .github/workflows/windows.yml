name: windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Rust core (DLL)
        run: |
          cargo build -p myowneq-ffi
          cargo build --release -p myowneq-ffi

      - name: Interop tests (C# models vs real Rust core)
        run: dotnet run --project windows/InteropTests -c Release

      - name: Publish app
        run: dotnet publish windows/MyOwnEQ/MyOwnEQ.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Check DLL is next to the exe
        shell: pwsh
        run: if (!(Test-Path publish/myowneq_ffi.dll)) { throw "myowneq_ffi.dll missing from publish output" }

      - name: Self-test (the real app starts, opens its windows, exits cleanly)
        shell: pwsh
        run: |
          $env:MYOWNEQ_DATA_DIR = Join-Path $env:RUNNER_TEMP "meq-selftest"
          $p = Start-Process -FilePath "publish/MyOwnEQ.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "self-test hung" }
          $log = Join-Path $env:MYOWNEQ_DATA_DIR "logs/myowneq.log"
          if (Test-Path $log) { Get-Content $log | ForEach-Object { "::error::$_" } }
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: MyOwnEQ-windows-x64
          path: publish/
