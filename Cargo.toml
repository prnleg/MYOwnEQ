[workspace]
resolver = "2"
members = ["core/dsp", "core/model", "core/sync", "core/update", "core/engine", "core/ffi", "server", "tools/release"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/prnleg/MYOwnEQ"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
rtrb = "0.3"
plist = "1"
realfft = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.8", features = ["ws"] }
rusqlite = { version = "0.32", features = ["bundled"] }
mdns-sd = "0.11"
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[profile.release]
lto = true
codegen-units = 1
