[workspace]
resolver = "2"
members = ["core/dsp", "core/model"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/prnleg/MYOwnEQ"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
rtrb = "0.3"
plist = "1"

[profile.release]
lto = true
codegen-units = 1
