# 1. echo "MYOWNEQ_TOKEN=$(openssl rand -hex 16)" > .env
# 2. docker compose up -d --build
# 3. In the app: Sync -> Server -> http://<server-ip>:7878 + the token from .env
services:
  myowneq:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: myowneq-server
    container_name: myowneq
    restart: unless-stopped
    ports:
      - "7878:7878"
    environment:
      MYOWNEQ_TOKEN: ${MYOWNEQ_TOKEN:?set MYOWNEQ_TOKEN in .env}
    volumes:
      - myowneq-data:/data

volumes:
  myowneq-data:
