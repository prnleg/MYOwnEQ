[package]
name = "myowneq-ffi"
description = "C ABI for MyOwnEQ native shells (Swift / C#)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
myowneq-dsp = { path = "../dsp" }
myowneq-engine = { path = "../engine", default-features = false }
myowneq-model = { path = "../model" }
myowneq-sync = { path = "../sync" }
myowneq-update = { path = "../update" }
myowneq-server = { path = "../../server" }
base64.workspace = true
qrcode.workspace = true
ureq.workspace = true
native-tls.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
